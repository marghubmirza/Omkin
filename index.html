<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Teaming | Omkin GovCon Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#0b192c',
                            dark: '#050d18',
                            light: '#1e3e62',
                            accent: '#00a8cc'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-dark text-gray-100 font-sans antialiased flex flex-col min-h-screen">

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-50 bg-brand/95 backdrop-blur border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex items-center gap-3 group">
                    <img src="Omkin.jpeg" alt="OmKin Logo" class="h-10 sm:h-12 w-auto object-contain rounded bg-white/5 p-1" onerror="this.src='https://placehold.co/150x50/0b192c/ffffff?text=OmKin'">
                </a>
                <nav class="hidden lg:flex items-center gap-6 text-sm font-medium">
                    <a href="index.html" class="text-gray-300 hover:text-brand-accent transition-colors">Home</a>
                    <a href="home.html" class="text-gray-300 hover:text-brand-accent transition-colors">Overview</a>
                    <a href="solutions.html" class="text-gray-300 hover:text-brand-accent transition-colors">Solutions</a>
                    <a href="capabilities.html" class="text-gray-300 hover:text-brand-accent transition-colors">Capabilities</a>
                    <a href="careers.html" class="text-gray-300 hover:text-brand-accent transition-colors">Careers</a>
                    <a href="about.html" class="text-gray-300 hover:text-brand-accent transition-colors">About Us</a>
                    <a href="compliance.html" class="text-gray-300 hover:text-brand-accent transition-colors">Compliance</a>
                    <a href="contact.html" class="bg-brand-accent text-brand-dark font-semibold px-4 py-2 rounded-lg transition-colors">Contact & Teaming</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Content Section -->
    <main class="flex-grow py-16 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto w-full">
        <h1 class="text-3xl sm:text-5xl font-extrabold text-white mb-4 text-center">Contact & Teaming Inquiries</h1>
        <p class="text-lg text-gray-300 mb-12 text-center max-w-xl mx-auto">
            Connect with our executive team for prime contracting partnerships, subcontracting opportunities, or cleared career inquiries.
        </p>

        <div class="bg-brand p-8 sm:p-10 rounded-2xl border border-white/10 shadow-xl">
            <form action="https://api.web3forms.com/submit" method="POST" class="space-y-6">
                <!-- Active Web3Forms Access Key -->
                <input type="hidden" name="access_key" value="0a416d5f-948d-4514-b267-9a915c6cb2b9">
                
                <!-- Optional Bot Protection / Subject Config -->
                <input type="hidden" name="subject" value="New Teaming / Contact Inquiry from Omkin.us">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Full Name</label>
                        <input type="text" name="name" required class="w-full bg-brand-dark border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-accent transition-colors" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Professional Email</label>
                        <input type="email" name="email" required class="w-full bg-brand-dark border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-accent transition-colors" placeholder="jdoe@agency.gov">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Inquiry Type / Subject</label>
                    <select name="inquiry_type" class="w-full bg-brand-dark border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-accent transition-colors">
                        <option value="Prime / Sub Teaming">Prime / Subcontracting Teaming</option>
                        <option value="Federal Opportunity">Federal Contract Opportunity</option>
                        <option value="Cleared Careers">Cleared Career Inquiry</option>
                        <option value="General Inquiry">General Partnership Inquiry</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Message</label>
                    <textarea name="message" rows="5" required class="w-full bg-brand-dark border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-accent transition-colors" placeholder="Provide details regarding your requirement, vehicle, or teaming interest..."></textarea>
                </div>

                <button type="submit" class="w-full bg-brand-accent hover:bg-cyan-500 text-brand-dark font-bold py-4 rounded-xl transition-all shadow-lg hover:shadow-cyan-500/20">
                    Send Secure Inquiry
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-brand-dark border-t border-white/10 py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="flex items-center gap-3">
                <img src="Omkin.jpeg" alt="OmKin Logo" class="h-8 w-auto object-contain rounded bg-white/5 p-1" onerror="this.src='https://placehold.co/120x40/0b192c/ffffff?text=OmKin'">
                <span class="text-sm text-gray-400">&copy; 2026 Omkin, LLC. All rights reserved.</span>
            </div>
            <div class="flex flex-wrap gap-6 text-sm text-gray-400">
                <a href="index.html" class="hover:text-brand-accent">Home</a>
                <a href="contact.html" class="hover:text-brand-accent">Contact</a>
            </div>
        </div>
    </footer>
</body>
</html>
